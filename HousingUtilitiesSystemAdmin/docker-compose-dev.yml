  services:
  # ============================================================================
  # MongoDB - Упрощенная версия для разработки (без replica set)
  # ============================================================================
  mongodb:
    image: mongo:latest
    container_name: mongodb-dev
    hostname: mongodb
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: admin123
      MONGO_INITDB_DATABASE: HousingUtilitiesSystemDB
    volumes:
      - mongodb-dev-data:/data/db
      - mongodb-dev-config:/data/configdb
    networks:
      - housing-dev-network
    restart: unless-stopped
    healthcheck:
      test: mongosh --quiet --eval "db.adminCommand('ping')"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s

  # ============================================================================
  # Redis - In-memory хранилище для кеширования и сессий
  # ============================================================================
  redis:
    image: redis:latest
    container_name: redis-dev
    hostname: redis
    ports:
      - "6379:6379"
    command: >
      redis-server
      --appendonly yes
      --appendfsync everysec
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
    volumes:
      - redis-dev-data:/data
    networks:
      - housing-dev-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  # ============================================================================
  # Redis Commander - Web UI для Redis (опционально)
  # ============================================================================
  redis-commander:
    image: ghcr.io/joeferner/redis-commander:latest
    container_name: redis-commander-dev
    hostname: redis-commander
    ports:
      - "8081:8081"
    environment:
      - REDIS_HOSTS=local:redis:6379
    networks:
      - housing-dev-network
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

# ==============================================================================
# Persistent Data Volumes - Именованные volumes для хранения данных
# ==============================================================================
volumes:
  mongodb-dev-data:
    driver: local
  mongodb-dev-config:
    driver: local
  redis-dev-data:
    driver: local

# ==============================================================================
# Network Configuration - Пользовательская bridge-сеть для разработки
# ==============================================================================
networks:
  housing-dev-network:
    driver: bridge
    name: housing-dev-network
