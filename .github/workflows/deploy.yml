name: Cloud Run Deployment

on:
  push:
    branches: [master]
    paths:
      - 'HousingUtilitiesSystemAdmin/**'
      - 'HousingUtilitiesSystemChairman/**'
      - 'HousingUtilitiesSystemUser/**'
      - 'pom.xml'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

env:
  PROJECT_ID: housing-system-2026
  REGION: europe-west3
  GAR_LOCATION: europe-west3-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/housing-repo # Assuming Artifact Registry or GCR. Using GCR for simplicity if AR not set up, but let's stick to simple image refs or GCR. 
  # Actually, user provided manual deploy commands using local source.
  # For CI/CD we need to build images and push them.
  # Let's use gcr.io as it's often enabled by default or easily accessible.
  IMAGE_REGISTRY: gcr.io

jobs:
  # ============================================================================
  # Authentication & Setup
  # ============================================================================
  setup:
    name: Setup & Auth
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # We don't strictly need a setup job if we do auth in each job, 
      # but it's good for verifying secrets early.
      # Skipped for speed/parallelism in actual deploy jobs.

  # ============================================================================
  # AI Service Deployment (g4f)
  # ============================================================================
  deploy-ai:
    name: Deploy AI Service
    runs-on: ubuntu-latest
    outputs:
      url: ${{ steps.deploy.outputs.url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Google Auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Deploy to Cloud Run
        id: deploy
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: housing-ai
          region: ${{ env.REGION }}
          image: hlohaus789/g4f:latest
          flags: '--allow-unauthenticated'
          env_vars: |
            G4F_PROXY=

  # ============================================================================
  # Admin Module Deployment
  # ============================================================================
  deploy-admin:
    name: Deploy Admin
    runs-on: ubuntu-latest
    needs: deploy-ai
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build with Maven
        run: mvn clean package -B -pl HousingUtilitiesSystemAdmin -am -DskipTests

      - name: Google Auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker
        run: gcloud auth configure-docker

      - name: Build and Push Container
        run: |
          docker build -f HousingUtilitiesSystemAdmin/Dockerfile.local -t gcr.io/${{ env.PROJECT_ID }}/housing-admin:${{ github.sha }} ./HousingUtilitiesSystemAdmin
          docker push gcr.io/${{ env.PROJECT_ID }}/housing-admin:${{ github.sha }}

      - name: Deploy to Cloud Run
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: housing-admin
          region: ${{ env.REGION }}
          image: gcr.io/${{ env.PROJECT_ID }}/housing-admin:${{ github.sha }}
          flags: '--allow-unauthenticated --vpc-connector=housing-connector --vpc-egress=private-ranges-only --memory=1Gi --cpu=1 --timeout=600'
          env_vars: |
            SPRING_PROFILES_ACTIVE=prod
            MONGODB_URI=${{ secrets.MONGODB_URI }}
            ELASTICSEARCH_URIS=${{ secrets.ELASTICSEARCH_URIS }}
            ELASTICSEARCH_USERNAME=${{ secrets.ELASTICSEARCH_USERNAME }}
            ELASTICSEARCH_PASSWORD=${{ secrets.ELASTICSEARCH_PASSWORD }}
            REDIS_HOST=${{ secrets.REDIS_HOST }}
            JWT_SECRET=${{ secrets.JWT_SECRET }}
            OAUTH_GOOGLE_CLIENT_ID=${{ secrets.OAUTH_GOOGLE_CLIENT_ID }}
            OAUTH_GOOGLE_CLIENT_SECRET=${{ secrets.OAUTH_GOOGLE_CLIENT_SECRET }}
            SENDGRID_API_KEY=${{ secrets.SENDGRID_API_KEY }}
            SENDGRID_FROM_EMAIL=${{ secrets.SENDGRID_FROM_EMAIL }}
            MAIL_USERNAME=${{ secrets.MAIL_USERNAME }}
            MAIL_PASSWORD=${{ secrets.MAIL_PASSWORD }}
            GCS_BUCKET=${{ secrets.GCS_BUCKET }}
            AI_GPT4FREE_URL=${{ needs.deploy-ai.outputs.url }}

  # ============================================================================
  # Chairman Module Deployment
  # ============================================================================
  deploy-chairman:
    name: Deploy Chairman
    runs-on: ubuntu-latest
    needs: deploy-ai
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build with Maven
        run: mvn clean package -B -pl HousingUtilitiesSystemChairman -am -DskipTests

      - name: Google Auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker
        run: gcloud auth configure-docker

      - name: Build and Push Container
        run: |
          docker build -f HousingUtilitiesSystemChairman/Dockerfile.local -t gcr.io/${{ env.PROJECT_ID }}/housing-chairman:${{ github.sha }} ./HousingUtilitiesSystemChairman
          docker push gcr.io/${{ env.PROJECT_ID }}/housing-chairman:${{ github.sha }}

      - name: Deploy to Cloud Run
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: housing-chairman
          region: ${{ env.REGION }}
          image: gcr.io/${{ env.PROJECT_ID }}/housing-chairman:${{ github.sha }}
          flags: '--allow-unauthenticated --vpc-connector=housing-connector --vpc-egress=private-ranges-only --memory=1Gi --cpu=1 --timeout=600'
          env_vars: |
             SPRING_PROFILES_ACTIVE=prod
             MONGODB_URI=${{ secrets.MONGODB_URI }}
             ELASTICSEARCH_URIS=${{ secrets.ELASTICSEARCH_URIS }}
             ELASTICSEARCH_USERNAME=${{ secrets.ELASTICSEARCH_USERNAME }}
             ELASTICSEARCH_PASSWORD=${{ secrets.ELASTICSEARCH_PASSWORD }}
             REDIS_HOST=${{ secrets.REDIS_HOST }}
             JWT_SECRET=${{ secrets.JWT_SECRET }}
             OAUTH_GOOGLE_CLIENT_ID=${{ secrets.OAUTH_GOOGLE_CLIENT_ID }}
             OAUTH_GOOGLE_CLIENT_SECRET=${{ secrets.OAUTH_GOOGLE_CLIENT_SECRET }}
             SENDGRID_API_KEY=${{ secrets.SENDGRID_API_KEY }}
             SENDGRID_FROM_EMAIL=${{ secrets.SENDGRID_FROM_EMAIL }}
             MAIL_USERNAME=${{ secrets.MAIL_USERNAME }}
             MAIL_PASSWORD=${{ secrets.MAIL_PASSWORD }}
             GCS_BUCKET=${{ secrets.GCS_BUCKET }}
             AI_GPT4FREE_URL=${{ needs.deploy-ai.outputs.url }}

  # ============================================================================
  # User Module Deployment
  # ============================================================================
  deploy-user:
    name: Deploy User
    runs-on: ubuntu-latest
    needs: deploy-ai
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build with Maven
        run: mvn clean package -B -pl HousingUtilitiesSystemUser -am -DskipTests

      - name: Google Auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker
        run: gcloud auth configure-docker

      - name: Build and Push Container
        run: |
          docker build -f HousingUtilitiesSystemUser/Dockerfile.local -t gcr.io/${{ env.PROJECT_ID }}/housing-user:${{ github.sha }} ./HousingUtilitiesSystemUser
          docker push gcr.io/${{ env.PROJECT_ID }}/housing-user:${{ github.sha }}

      - name: Deploy to Cloud Run
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: housing-user
          region: ${{ env.REGION }}
          image: gcr.io/${{ env.PROJECT_ID }}/housing-user:${{ github.sha }}
          flags: '--allow-unauthenticated --vpc-connector=housing-connector --vpc-egress=private-ranges-only --memory=1Gi --cpu=1 --timeout=600'
          env_vars: |
             SPRING_PROFILES_ACTIVE=prod
             MONGODB_URI=${{ secrets.MONGODB_URI }}
             ELASTICSEARCH_URIS=${{ secrets.ELASTICSEARCH_URIS }}
             ELASTICSEARCH_USERNAME=${{ secrets.ELASTICSEARCH_USERNAME }}
             ELASTICSEARCH_PASSWORD=${{ secrets.ELASTICSEARCH_PASSWORD }}
             REDIS_HOST=${{ secrets.REDIS_HOST }}
             JWT_SECRET=${{ secrets.JWT_SECRET }}
             OAUTH_GOOGLE_CLIENT_ID=${{ secrets.OAUTH_GOOGLE_CLIENT_ID }}
             OAUTH_GOOGLE_CLIENT_SECRET=${{ secrets.OAUTH_GOOGLE_CLIENT_SECRET }}
             SENDGRID_API_KEY=${{ secrets.SENDGRID_API_KEY }}
             SENDGRID_FROM_EMAIL=${{ secrets.SENDGRID_FROM_EMAIL }}
             MAIL_USERNAME=${{ secrets.MAIL_USERNAME }}
             MAIL_PASSWORD=${{ secrets.MAIL_PASSWORD }}
             GCS_BUCKET=${{ secrets.GCS_BUCKET }}
             AI_GPT4FREE_URL=${{ needs.deploy-ai.outputs.url }}

